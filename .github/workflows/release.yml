name: Publish userscript

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify release tag
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Expected a stable tag matching package.json (v$version), got $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Build release assets
        run: |
          pnpm_version="$(node -p 'require("./package.json").devEngines.packageManager.version')"
          npm install --global "pnpm@$pnpm_version"
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            dist/userscript/pikabu-expand-comments.user.js \
            dist/userscript/pikabu-expand-comments.meta.js
