name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to publish/re-publish (e.g. v0.3.0)"
        required: true
        type: string
      publish_cws:
        description: "Publish Chrome package to Chrome Web Store"
        required: false
        default: true
        type: boolean
      publish_amo:
        description: "Submit Firefox package + source archive to AMO"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}

  publish-assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Build userscript and extension packages
        run: |
          pnpm_version="$(node -p 'require("./package.json").devEngines.packageManager.version')"
          npm install --global "pnpm@$pnpm_version"
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm run lint:firefox
      - name: Verify release assets
        run: |
          test -s dist/userscript/pikabu-expand-comments.user.js
          test -s dist/userscript/pikabu-expand-comments.meta.js
          test -s dist/pikabu-expand-comments-chrome.zip
          test -s dist/pikabu-expand-comments-firefox.zip
          test -s dist/pikabu-expand-comments-firefox-source.zip
      - name: Upload assets and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" --clobber \
            dist/userscript/pikabu-expand-comments.user.js \
            dist/userscript/pikabu-expand-comments.meta.js \
            dist/pikabu-expand-comments-chrome.zip \
            dist/pikabu-expand-comments-firefox.zip \
            dist/pikabu-expand-comments-firefox-source.zip
          gh release edit "$TAG_NAME" --draft=false --latest

  publish-cws:
    needs: [release-please, publish-assets]
    if: >-
      always() &&
      (
        (github.event_name == 'push' && needs.publish-assets.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_cws == true)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || needs.publish-assets.outputs.tag_name }}
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
      CWS_WIF_PROVIDER: ${{ vars.CWS_GCP_WORKLOAD_IDENTITY_PROVIDER }}
      CWS_SERVICE_ACCOUNT: ${{ vars.CWS_GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Check CWS configuration
        id: check
        run: |
          if [ -z "$CWS_PUBLISHER_ID" ] || [ -z "$CWS_EXTENSION_ID" ] || [ -z "$CWS_WIF_PROVIDER" ] || [ -z "$CWS_SERVICE_ACCOUNT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping CWS publish: configure CWS_PUBLISHER_ID, CWS_EXTENSION_ID, CWS_GCP_WORKLOAD_IDENTITY_PROVIDER, and CWS_GCP_SERVICE_ACCOUNT variables first."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.configured == 'true'
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Build Chrome MV3 package
        if: steps.check.outputs.configured == 'true'
        run: |
          pnpm_version="$(node -p 'require("./package.json").devEngines.packageManager.version')"
          npm install --global "pnpm@$pnpm_version"
          pnpm install --frozen-lockfile
          pnpm run build:chrome
      - name: Authenticate to Google Cloud via OIDC
        id: auth
        if: steps.check.outputs.configured == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.CWS_WIF_PROVIDER }}
          service_account: ${{ env.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - name: Upload and publish via Chrome Web Store API v2
        if: steps.check.outputs.configured == 'true'
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          upload_response="$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @dist/pikabu-expand-comments-chrome.zip \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:upload")"
          echo "CWS upload response: $upload_response"
          upload_state="$(node -e 'const r = JSON.parse(process.argv[1]); console.log(r.uploadState ?? "");' "$upload_response")"
          for _ in $(seq 1 12); do
            if [ "$upload_state" != "IN_PROGRESS" ]; then
              break
            fi
            sleep 5
            status_response="$(curl --fail-with-body -sS \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://chromewebstore.googleapis.com/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:fetchStatus")"
            echo "CWS fetchStatus response: $status_response"
            upload_state="$(node -e 'const r = JSON.parse(process.argv[1]); console.log(r.lastAsyncUploadState ?? r.uploadState ?? "");' "$status_response")"
          done
          if [ "$upload_state" != "SUCCEEDED" ]; then
            echo "CWS upload did not succeed (state=${upload_state})" >&2
            exit 1
          fi
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"publishType":"DEFAULT_PUBLISH"}' \
            "https://chromewebstore.googleapis.com/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:publish"

  publish-amo:
    needs: [release-please, publish-assets]
    if: >-
      always() &&
      (
        (github.event_name == 'push' && needs.publish-assets.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_amo == true)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || needs.publish-assets.outputs.tag_name }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - name: Check AMO configuration
        id: check
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping AMO submit: configure AMO_JWT_ISSUER and AMO_JWT_SECRET secrets first."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.configured == 'true'
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Build Firefox MV3 package and source archive
        if: steps.check.outputs.configured == 'true'
        run: |
          pnpm_version="$(node -p 'require("./package.json").devEngines.packageManager.version')"
          npm install --global "pnpm@$pnpm_version"
          pnpm install --frozen-lockfile
          pnpm run build:firefox
          pnpm run build:source
          pnpm run lint:firefox
      - name: Submit listed version to AMO (API v5)
        if: steps.check.outputs.configured == 'true'
        run: |
          pnpm exec web-ext sign \
            --channel=listed \
            --source-dir=dist/firefox \
            --upload-source-code=dist/pikabu-expand-comments-firefox-source.zip \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET" \
            --approval-timeout=0
